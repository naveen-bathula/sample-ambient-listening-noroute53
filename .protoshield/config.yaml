protoshield_version: v0.16.2
model_id: global.anthropic.claude-haiku-4-5-20251001-v1:0
enabled_plugins:
    - bandit
    - cdknag
    - cfnnag
    - checkov
    - cve
    - iam-least-privilege
    - license-headers
    - markdown-report
    - secrets
    - semgrep
plugins:
    bandit:
        timeout: "300"
    cdknag:
        timeout: "300"
    cfnnag:
        timeout: "300"
    checkov:
        timeout: "300"
    cve:
        timeout: "600"
    license-headers:
        license_text: Apache 2.0
        timeout: "120"
    markdown-report:
        report_filename: summary.md
    secrets:
        timeout: "300"
    semgrep:
        timeout: "300"
